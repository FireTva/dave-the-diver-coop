name: Build installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag, such as v1.0.0. Leave blank to build only."
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build and verify pinned packages
        shell: pwsh
        run: |
          dotnet run --project .\DaveDiverCoopInstaller.csproj -c Release -- --verify
          if ($LASTEXITCODE -ne 0) { throw "Package verification failed." }
      - name: Publish self-contained Windows x64 installer
        shell: pwsh
        run: |
          dotnet publish .\DaveDiverCoopInstaller.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true -o .\publish
          if ($LASTEXITCODE -ne 0) { throw "Installer publish failed." }
          $hash = (Get-FileHash .\publish\DaveDiverCoopSetup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  DaveDiverCoopSetup.exe" | Set-Content .\publish\DaveDiverCoopSetup.exe.sha256 -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: DaveDiverCoopSetup-win-x64
          path: |
            publish/DaveDiverCoopSetup.exe
            publish/DaveDiverCoopSetup.exe.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $tag = $env:RELEASE_TAG
          if (-not $tag) { $tag = $env:GITHUB_REF_NAME }
          gh release create "$tag" `
            .\publish\DaveDiverCoopSetup.exe `
            .\publish\DaveDiverCoopSetup.exe.sha256 `
            --target main `
            --title "Dave the Diver Co-op Setup $tag" `
            --notes "Self-contained Windows x64 installer. See the repository README for tested status and networking security limitations."
