name: Build installer








on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag, such as v1.0.0. Leave blank to build only."
        required: false
        type: string








permissions:
  contents: write








jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4








      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x








      - name: Build and verify pinned packages
        shell: pwsh
        run: |
          dotnet run --project ./DaveDiverCoopInstaller.csproj -c Release -- --verify
          if ($LASTEXITCODE -ne 0) { throw "Package verification failed." }
          dotnet run --project ./DaveDiverSteamInviteSetup.csproj -c Release -- --verify
          if ($LASTEXITCODE -ne 0) { throw "Steam-invite package verification failed." }
      - name: Publish self-contained Windows x64 installer
        shell: pwsh
        run: |
          dotnet publish ./DaveDiverCoopInstaller.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./publish/community
          if ($LASTEXITCODE -ne 0) { throw "Installer publish failed." }
          dotnet publish ./DaveDiverSteamInviteSetup.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./publish/steam-invite
          if ($LASTEXITCODE -ne 0) { throw "Steam-invite installer publish failed." }
          foreach ($name in @("DaveDiverCoopSetup", "DaveDiverSteamInviteSetup")) {
            $folder = if ($name -eq "DaveDiverCoopSetup") { "community" } else { "steam-invite" }
            $file = "./publish/$folder/$name.exe"
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name.exe" | Set-Content "$file.sha256" -Encoding ascii
          }
          Copy-Item ./SteamInvitePrototype-source.zip ./publish/SteamInvitePrototype-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DaveDiverCoopInstallers-win-x64
          path: |
            publish/community/DaveDiverCoopSetup.exe
            publish/community/DaveDiverCoopSetup.exe.sha256
            publish/steam-invite/DaveDiverSteamInviteSetup.exe
            publish/steam-invite/DaveDiverSteamInviteSetup.exe.sha256
            publish/SteamInvitePrototype-source.zip
          if-no-files-found: error
          retention-days: 30








      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $tag = $env:RELEASE_TAG
          if (-not $tag) { $tag = $env:GITHUB_REF_NAME }
          gh release create "$tag" ./publish/community/DaveDiverCoopSetup.exe ./publish/community/DaveDiverCoopSetup.exe.sha256 ./publish/steam-invite/DaveDiverSteamInviteSetup.exe ./publish/steam-invite/DaveDiverSteamInviteSetup.exe.sha256 ./publish/SteamInvitePrototype-source.zip --target main --title "Dave the Diver Co-op Setup $tag" --notes "Two separate self-contained Windows x64 installers: the existing Coop-Divers setup and an experimental Steam-invite prototype. The invite prototype has not been verified in a two-client game session and synchronizes only diver position/facing. See README for limitations and networking details."
