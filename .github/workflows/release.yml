name: Build installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag, such as v1.0.0. Leave blank to build only."
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build and verify pinned packages
        shell: pwsh
        run: |
          dotnet run --project .\DaveDiverCoopInstaller.csproj -c Release -- --verify
          if ($LASTEXITCODE -ne 0) { throw "Package verification failed." }
          dotnet run --project .\DaveDiverSteamInviteSetup.csproj -c Release -- --verify
          if ($LASTEXITCODE -ne 0) { throw "Steam-invite package verification failed." }
      - name: Publish self-contained Windows x64 installer
        shell: pwsh
        run: |
          dotnet publish .\DaveDiverCoopInstaller.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true -o .\publish\community
          if ($LASTEXITCODE -ne 0) { throw "Installer publish failed." }
          dotnet publish .\DaveDiverSteamInviteSetup.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true -o .\publish\steam-invite
          if ($LASTEXITCODE -ne 0) { throw "Steam-invite installer publish failed." }
          foreach ($name in @("DaveDiverCoopSetup", "DaveDiverSteamInviteSetup")) {
            $folder = if ($name -eq "DaveDiverCoopSetup") { "community" } else { "steam-invite" }
            $file = ".\publish\$folder\$name.exe"
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name.exe" | Set-Content "$file.sha256" -Encoding ascii
          }
          Copy-Item .\SteamInvitePrototype-source.zip .\publish\SteamInvitePrototype-source.zip

          $linuxStage = Join-Path $env:RUNNER_TEMP "DaveDiverSteamInviteLinux"
          Expand-Archive .\BepInEx-Unity-IL2CPP-Win-x64-be.789.zip -DestinationPath $linuxStage
          $pluginDirectory = Join-Path $linuxStage "BepInEx\plugins\DaveTheDiverCoop"
          New-Item -ItemType Directory -Path $pluginDirectory -Force | Out-Null
          Copy-Item .\DaveTheDiverCoop.dll (Join-Path $pluginDirectory "DaveTheDiverCoop.dll")
          Copy-Item .\LICENSE (Join-Path $pluginDirectory "LICENSE.txt")
          $linuxPackage = ".\publish\DaveDiverSteamInviteLinux.zip"
          Add-Type -AssemblyName System.IO.Compression
          $packageStream = [System.IO.File]::Open(
            (Join-Path (Get-Location) $linuxPackage),
            [System.IO.FileMode]::CreateNew)
          try {
            $packageArchive = [System.IO.Compression.ZipArchive]::new(
              $packageStream,
              [System.IO.Compression.ZipArchiveMode]::Create)
            try {
              Get-ChildItem -LiteralPath $linuxStage -Force -Recurse -File | ForEach-Object {
                $relativePath = $_.FullName.Substring($linuxStage.Length + 1).Replace("\", "/")
                $entry = $packageArchive.CreateEntry(
                  $relativePath,
                  [System.IO.Compression.CompressionLevel]::Optimal)
                $inputStream = [System.IO.File]::OpenRead($_.FullName)
                $outputStream = $entry.Open()
                try {
                  $inputStream.CopyTo($outputStream)
                }
                finally {
                  $outputStream.Dispose()
                  $inputStream.Dispose()
                }
              }
            }
            finally {
              $packageArchive.Dispose()
            }
          }
          finally {
            $packageStream.Dispose()
          }
          $linuxHash = (Get-FileHash $linuxPackage -Algorithm SHA256).Hash.ToLowerInvariant()
          "$linuxHash  DaveDiverSteamInviteLinux.zip" | Set-Content "$linuxPackage.sha256" -Encoding ascii
          Copy-Item .\install-steam-invite-linux.sh .\publish\install-steam-invite-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: DaveDiverCoop-ReleaseAssets
          path: |
            publish/community/DaveDiverCoopSetup.exe
            publish/community/DaveDiverCoopSetup.exe.sha256
            publish/steam-invite/DaveDiverSteamInviteSetup.exe
            publish/steam-invite/DaveDiverSteamInviteSetup.exe.sha256
            publish/SteamInvitePrototype-source.zip
            publish/DaveDiverSteamInviteLinux.zip
            publish/DaveDiverSteamInviteLinux.zip.sha256
            publish/install-steam-invite-linux.sh
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $tag = $env:RELEASE_TAG
          if (-not $tag) { $tag = $env:GITHUB_REF_NAME }
          gh release create "$tag" `
            .\publish\community\DaveDiverCoopSetup.exe `
            .\publish\community\DaveDiverCoopSetup.exe.sha256 `
            .\publish\steam-invite\DaveDiverSteamInviteSetup.exe `
            .\publish\steam-invite\DaveDiverSteamInviteSetup.exe.sha256 `
            .\publish\SteamInvitePrototype-source.zip `
            .\publish\DaveDiverSteamInviteLinux.zip `
            .\publish\DaveDiverSteamInviteLinux.zip.sha256 `
            .\publish\install-steam-invite-linux.sh `
            --target main `
            --title "Dave the Diver Co-op Setup $tag" `
            --notes "Release $tag includes updated Windows setup installers and the Linux/Steam Deck Proton downloader. The experimental Steam-invite prototype has a hideable co-op panel with a solid dark background and supports creating or joining a friends-only lobby from the Blue Hole, boat, or sushi bar. A visual partner avatar is attempted in matching scenes; boat/bar avatars are movement proxies only. Interactions and shared world/story state are not synchronized, and two-client gameplay has not been verified. See README for limitations and Linux launch-option instructions."
